name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn pytest torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/ -q
