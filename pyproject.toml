# Reproducibility manifest for the research substrate (D45).
#
# torch/torchvision are ROCm builds and CANNOT be installed from PyPI with
# these pins alone — install them first from the ROCm index:
#   pip install torch==2.13.0+rocm7.2 torchvision==0.28.0+rocm7.2 \
#       --index-url https://download.pytorch.org/whl/rocm7.2
# then `pip install -e .`. On WSL2 + RX 9070 (gfx1201), after EVERY torch
# install/upgrade delete torch's bundled libhsa-runtime64.so (see README).

[project]
name = "foundation"
version = "0.1.0"
description = "Separable codec / latent reasoner / external knowledge store"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "transformers==5.14.1",
    "peft==0.19.1",
    "accelerate==1.14.0",
    "FlagEmbedding==1.4.0",
    "spacy==3.8.14",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "sentencepiece==0.2.2",
    "safetensors==0.8.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["codec", "codec.evals"]
